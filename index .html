<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye Havalimanları</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif}#map{height:100%;width:100%}.title{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:1000;background:#062738;color:#fff;padding:12px 25px;border-radius:10px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.4)}.title strong{color:#30e58e}
</style>
</head>
<body>
<div class="title">✈ <strong>Türkiye Havalimanları</strong><br>Havacılık Yakıt Haritası</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([39.0,35.0],3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const airports=[
{name:'İstanbul Havalimanı',iata:'IST',icao:'LTFM',lat:41.2753,lon:28.7519},
{name:'Sabiha Gökçen Havalimanı',iata:'SAW',icao:'LTFJ',lat:40.8986,lon:29.3092},
{name:'Ankara Esenboğa Havalimanı',iata:'ESB',icao:'LTAC',lat:40.1281,lon:32.9951},
{name:'İzmir Adnan Menderes Havalimanı',iata:'ADB',icao:'LTBJ',lat:38.2924,lon:27.1570},
{name:'Antalya Havalimanı',iata:'AYT',icao:'LTAI',lat:36.8987,lon:30.8005}
];
airports.forEach(a=>L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>✈ '+a.name+'</b><br><br>IATA: <b>'+a.iata+'</b><br>ICAO: <b>'+a.icao+'</b><br><br>⛽ Jet A-1<br>🌱 SAF'));
</script>
</body>
</html>
