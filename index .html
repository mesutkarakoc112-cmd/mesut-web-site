<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye Havalimanları</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif}#map{height:100%;width:100%}.title{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:1000;background:#062738;color:#fff;padding:12px 25px;border-radius:10px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.4)}.title strong{color:#30e58e}
.turkey-btn{position:absolute;top:18px;right:20px;z-index:1000;border:0;border-radius:9px;background:#e30a17;color:white;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.world-btn{position:absolute;top:18px;right:145px;z-index:1000;border:0;border-radius:9px;background:#062738;color:white;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="title">✈ <strong>Türkiye Havalimanları</strong><br>Havacılık Yakıt Haritası</div>
<button class="world-btn" onclick="showWorld()">🌍 Dünya</button>
<button class="turkey-btn" onclick="showTurkey()">🇹🇷 Türkiye</button>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([20,10],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
const airports=[
{name:'İstanbul Havalimanı',iata:'IST',icao:'LTFM',lat:41.2753,lon:28.7519},
{name:'Sabiha Gökçen Havalimanı',iata:'SAW',icao:'LTFJ',lat:40.8986,lon:29.3092},
{name:'Ankara Esenboğa Havalimanı',iata:'ESB',icao:'LTAC',lat:40.1281,lon:32.9951},
{name:'İzmir Adnan Menderes Havalimanı',iata:'ADB',icao:'LTBJ',lat:38.2924,lon:27.1570},
{name:'Antalya Havalimanı',iata:'AYT',icao:'LTAI',lat:36.8987,lon:30.8005}
];
function showTurkey(){map.flyTo([39.0,35.0],6,{duration:1.4});}
function showWorld(){map.flyTo([20,10],2,{duration:1.4});}

airports.forEach(a=>L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>✈ '+a.name+'</b><br><br>IATA: <b>'+a.iata+'</b><br>ICAO: <b>'+a.icao+'</b><br><br>⛽ Jet A-1<br>🌱 SAF'));
</script>
</body>
</html>
