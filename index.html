<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOCAR Türkiye Aviation Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
:root{--gold:#f3d56b;--green:#10d37a;--orange:#ff8a2a;--blue:#28a5ff;--dark:#0b1520}
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle,#3b2b08 0,#100c03 58%,#020201 100%)}
.top{position:absolute;z-index:10;top:14px;left:50%;transform:translateX(-50%);background:#211906e8;color:#fff;padding:10px 18px;border:1px solid #ffffff22;border-radius:14px;text-align:center}.top b{color:var(--gold)}
.buttons{position:absolute;z-index:12;top:14px;right:14px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.buttons button{border:0;border-radius:10px;padding:10px 13px;color:#fff;font-weight:700;cursor:pointer}.world{background:#18445f}.turkey{background:#d71920}.socar{background:#007a3d}.facilityBtn{background:#176fad}
.marker{width:22px;height:22px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:11px;cursor:pointer}.public{background:#ffd258;box-shadow:0 0 10px #ffd258}.direct{background:var(--green);box-shadow:0 0 13px var(--green)}.throughput{background:var(--orange);box-shadow:0 0 14px var(--orange)}.facility{width:27px;height:27px;background:var(--blue);box-shadow:0 0 16px var(--blue);font-size:14px}
.legend{position:absolute;left:14px;bottom:14px;z-index:12;background:#17120bd9;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.7}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.green{background:var(--green)}.orange{background:var(--orange)}.blue{background:var(--blue)}
.maplibregl-canvas{filter:sepia(.72) saturate(1.55) hue-rotate(355deg) brightness(.9) contrast(1.08)}.maplibregl-popup-content{border-radius:10px;background:#241a07;color:#fff2b0;border:1px solid #d3ad47}
.drawer{position:absolute;z-index:30;right:14px;top:70px;width:min(720px,calc(100% - 28px));height:calc(100% - 84px);background:#091520f7;color:#fff;border:1px solid #ffffff22;border-radius:16px;box-shadow:0 16px 50px #000a;display:none;overflow:hidden}.drawerHead{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 18px;background:#102637}.drawerHead h2{margin:0;color:#65c6ff}.drawerHead small{color:#a9bdcc}.x{background:#334957;color:#fff;border:0;border-radius:8px;padding:8px 11px;cursor:pointer}.tabs{display:flex;gap:5px;padding:9px;overflow-x:auto;background:#0c1d29}.tabs button{white-space:nowrap;border:0;border-radius:8px;padding:9px 11px;background:#183244;color:#cfe2ef;cursor:pointer}.tabs button.active{background:#176fad;color:#fff}.content{height:calc(100% - 116px);overflow:auto;padding:16px}.card{background:#0f2432;border:1px solid #ffffff18;border-radius:12px;padding:14px;margin-bottom:12px}.card h3{margin:0 0 11px;color:#64e5ad}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;color:#9eb4c3;font-size:12px;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid #315064;border-radius:8px;background:#07121b;color:#fff;padding:9px}.field textarea{min-height:72px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.save{background:#14c87b;color:#062416}.add{background:#1c6c92;color:#fff}.remove{background:#8c2730;color:#fff}.secondary{background:#405563;color:#fff}.photoBox{border:2px dashed #3e6175;border-radius:12px;padding:14px;text-align:center}.photoBox img{max-width:100%;max-height:290px;border-radius:10px;display:none}.records{display:grid;gap:10px}.record{background:#0a1c28;border:1px solid #ffffff16;border-radius:10px;padding:10px}.notice{font-size:11px;color:#9db1bf;line-height:1.5}.mode{display:inline-block;background:#176fad;color:#fff;border-radius:999px;padding:4px 9px;font-size:11px;margin-top:5px}
@media(max-width:760px){.top{display:none}.buttons{left:8px;right:8px}.drawer{top:62px;height:calc(100% - 70px);right:7px;width:calc(100% - 14px)}.grid{grid-template-columns:1fr}.legend{display:none}}
</style></head><body>
<div class="top">🌐 <b>GLOBAL AVIATION FUEL MAP</b><br><small>Türkiye / Turkey</small></div>
<div class="buttons"><button class="world" id="world">🌍 Dünya</button><button class="turkey" id="turkey">🇹🇷 Türkiye</button><button class="socar" id="socar">SOCAR TÜRKİYE AVIATION</button><button class="facilityBtn" id="facilities">🏭 Tesisler</button></div>
<div class="legend"><div><span class="dot green"></span>SOCAR Aviation</div><div><span class="dot orange"></span>Throughput Satış</div><div><span class="dot blue"></span>SOCAR Tesisi</div></div><div id="map"></div>
<div class="drawer" id="drawer"><div class="drawerHead"><div><h2>İzmir Adnan Menderes Tesisi</h2><small>ADB • LTBJ • SOCAR Türkiye Aviation</small><br><span class="mode">Pilot Tesis Bilgi Merkezi</span></div><button class="x" id="closeDrawer">Kapat</button></div><div class="tabs" id="tabs"></div><div class="content" id="content"></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[20,28],zoom:1.15,canvasContextAttributes:{antialias:true}});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('style.load',()=>map.setProjection({type:'globe'}));
const airports=[['IST','İstanbul Havalimanı','LTFM',28.7519,41.2753],['SAW','Sabiha Gökçen','LTFJ',29.3092,40.8986],['ESB','Ankara Esenboğa','LTAC',32.9951,40.1281],['ADB','İzmir Adnan Menderes','LTBJ',27.157,38.2924],['AYT','Antalya Havalimanı','LTAI',30.8005,36.8987],['DLM','Dalaman Havalimanı','LTBS',28.7925,36.7131],['BJV','Milas-Bodrum Havalimanı','LTFE',27.6643,37.2506],['COV','Çukurova Uluslararası Havalimanı','LTDB',35.0705,36.8909],['TZX','Trabzon Havalimanı','LTCG',39.7897,40.9951],['GZT','Gaziantep Havalimanı','LTAJ',37.4787,36.9472],['ASR','Kayseri Havalimanı','LTAU',35.4954,38.7704],['DIY','Diyarbakır Havalimanı','LTCC',40.201,37.8939],['VAN','Van Ferit Melen Havalimanı','LTCI',43.3323,38.4682],['ERZ','Erzurum Havalimanı','LTCE',41.1702,39.9565],['SZF','Samsun Çarşamba Havalimanı','LTFH',36.5671,41.2545],['OGU','Ordu-Giresun Havalimanı','LTCB',38.0809,40.966],['RZV','Rize-Artvin Havalimanı','LTFO',40.8294,41.1794],['GZP','Gazipaşa-Alanya Havalimanı','LTFG',32.3006,36.2992],['KYA','Konya Havalimanı','LTAN',32.5619,37.979],['MLX','Malatya Havalimanı','LTAT',38.2539,38.4353],['EZS','Elazığ Havalimanı','LTCA',39.2914,38.6069],['HTY','Hatay Havalimanı','LTDA',36.2822,36.3628],['DNZ','Denizli Çardak Havalimanı','LTAY',29.7013,37.7856],['NAV','Nevşehir Kapadokya Havalimanı','LTAZ',34.5345,38.7719],['MQM','Mardin Havalimanı','LTCR',40.6317,37.2233],['BAL','Batman Havalimanı','LTCJ',41.1166,37.929],['MSR','Muş Havalimanı','LTCK',41.6612,38.7478],['AJI','Ağrı Havalimanı','LTCO',43.025,39.6545],['KSY','Kars Havalimanı','LTCF',43.115,40.5622],['IGD','Iğdır Havalimanı','LTCT',43.8766,39.9766],['NKT','Şırnak Cizre Havalimanı','LTCV',42.0582,37.3647]];
const direct=new Set(['AYT','ADB','BJV','DLM','GZP','ESB','SAW']),throughput=new Set(['COV','ASR','TZX']),facilityCodes=new Set(['ADB']);let markers=[];
function addMarkers(mode='all'){markers.forEach(m=>m.remove());markers=[];airports.filter(a=>mode==='all'||(mode==='socar'&&(direct.has(a[0])||throughput.has(a[0])))||(mode==='facility'&&facilityCodes.has(a[0]))).forEach(a=>{const el=document.createElement('div');const cls=facilityCodes.has(a[0])?'facility':throughput.has(a[0])?'throughput':direct.has(a[0])?'direct':'public';el.className='marker '+cls;el.textContent=facilityCodes.has(a[0])?'🏭':'✈';el.onclick=()=>{if(a[0]==='ADB')openFacility();};markers.push(new maplibregl.Marker({element:el}).setLngLat([a[3],a[4]]).setPopup(new maplibregl.Popup({offset:16}).setHTML(`<b>${a[1]}</b><br>IATA: ${a[0]} • ICAO: ${a[2]}${facilityCodes.has(a[0])?'<br>🔵 SOCAR Tesisi':''}`)).addTo(map));});}
map.on('load',()=>addMarkers());world.onclick=()=>{addMarkers();map.flyTo({center:[20,28],zoom:1.15,duration:1500})};turkey.onclick=()=>{addMarkers();map.flyTo({center:[35,39],zoom:4.6,duration:1500})};socar.onclick=()=>{addMarkers('socar');map.flyTo({center:[35,39],zoom:4.6,duration:1500})};facilities.onclick=()=>{addMarkers('facility');map.flyTo({center:[27.157,38.2924],zoom:7,duration:1500})};
const modules=[['general','🏭 Genel Bilgiler'],['receiving','📥 Mal Kabul'],['tanks','🛢️ Tanklar'],['fuelling','✈️ Uçak İkmal'],['equipment','🚛 Araç & Ekipman'],['quality','🔬 Kalite'],['plan','🗺️ Tesis Planı'],['photos','📷 Fotoğraflar'],['cameras','🎥 Kamera'],['hse','🧯 HSE'],['docs','📄 Dokümanlar']];
const templates={general:['Tesis adı','Tesis kodu','Tesis tipi','İşletmeye alma tarihi','Toplam tesis alanı (m²)','Kapalı alan (m²)','Tank sahası alanı (m²)','Operasyon saatleri','Sertifikasyon / standartlar','Açıklama'],receiving:['Kabul yöntemi','Mal kabul noktası sayısı','Tanker park kapasitesi','Kabul debisi','Maksimum kabul basıncı','Bonding / interlock','Numune alma noktaları','Evrak kontrolü','Görünüş / yoğunluk / CWD','Settling süresi','Uygunsuz ürün prosedürü'],fuelling:['Into-plane hizmet modeli','Refueller operasyonları','Hydrant / dispenser','Günlük ortalama ikmal','Yoğun gün kapasitesi','Ortalama ikmal süresi','SLA hedefi','Deadman / bonding / interlock','Acil durdurma','Operasyon notları'],quality:['Günlük tank kontrolü','Görünüş kontrolü','Yoğunluk ölçümü','CWD','Membran filtrasyon','Diferansiyel basınç','CoQ / CoA / RCQ / RT','Recertification','Kalibrasyon','Uygunsuzluk / DÖF'],plan:['Toplam alan','Tank sahası','Mal kabul sahası','Dolum adası','Araç park alanı','Ofis / kalite alanı','Boru hatları','Vana noktaları','Numune noktaları','Acil çıkış / toplanma alanı'],cameras:['Kamera kodu','Konum','Baktığı yön','Kapsama alanı','Kamera tipi','Aktif / arızalı','Son bakım'],hse:['Yangın sistemi','Köpük sistemi','Yangın suyu kapasitesi','Spill kit noktaları','Acil durdurmalar','Toplanma alanı','Son tatbikat','Olay / ramak kala','Acil durum planı']};
let active='general';function key(m){return 'adb-facility-'+m}function load(m){return JSON.parse(localStorage.getItem(key(m))||'null')||{fields:(templates[m]||[]).map(x=>[x,'']),records:[]}}
function save(m,d){localStorage.setItem(key(m),JSON.stringify(d));alert('Bu tarayıcıya kaydedildi.');}
function openFacility(){drawer.style.display='block';buildTabs();render(active)}closeDrawer.onclick=()=>drawer.style.display='none';
function buildTabs(){tabs.innerHTML='';modules.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=id===active?'active':'';b.onclick=()=>{active=id;buildTabs();render(id)};tabs.appendChild(b)})}
function fieldsHTML(data){return `<div class="grid">${data.fields.map((f,i)=>`<div class="field"><label contenteditable="true">${f[0]}</label>${i===data.fields.length-1?`<textarea>${f[1]}</textarea>`:`<input value="${String(f[1]).replaceAll('"','&quot;')}">`}</div>`).join('')}</div>`}
function collectFields(){return [...content.querySelectorAll('.field')].map(d=>[d.querySelector('label').innerText.trim(),d.querySelector('input,textarea')?.value||''])}
function render(m){const data=load(m);if(m==='photos'){renderPhotos(data);return}if(['tanks','equipment','docs'].includes(m)){renderRecords(m,data);return}content.innerHTML=`<div class="card"><h3>${modules.find(x=>x[0]===m)[1]}</h3>${fieldsHTML(data)}<div class="toolbar"><button class="add" id="addF">+ Alan Ekle</button><button class="remove" id="delF">− Son Alanı Sil</button><button class="save" id="saveF">Kaydet</button></div></div><div class="notice">Public web sitesinde fiyat, marj, sözleşme, kamera erişimi ve kritik güvenlik bilgisi tutmayın. Merkezi yetkili kayıt için SharePoint bağlantısı ikinci aşamada kurulacaktır.</div>`;addF.onclick=()=>{data.fields=collectFields();data.fields.push(['Yeni alan','']);save(m,data);render(m)};delF.onclick=()=>{data.fields=collectFields();data.fields.pop();save(m,data);render(m)};saveF.onclick=()=>{data.fields=collectFields();save(m,data)}}
function renderRecords(m,data){const names={tanks:'Tank',equipment:'Araç / Ekipman',docs:'Doküman'};content.innerHTML=`<div class="card"><h3>${modules.find(x=>x[0]===m)[1]}</h3><div class="records">${data.records.map((r,i)=>`<div class="record"><b>${r.title||names[m]+' '+(i+1)}</b><div class="grid"><div class="field"><label>Başlık</label><input data-i="${i}" data-k="title" value="${r.title||''}"></div><div class="field"><label>Durum / Tür</label><input data-i="${i}" data-k="status" value="${r.status||''}"></div><div class="field"><label>Açıklama</label><textarea data-i="${i}" data-k="note">${r.note||''}</textarea></div></div></div>`).join('')}</div><div class="toolbar"><button class="add" id="addR">+ ${names[m]} Ekle</button><button class="remove" id="delR">− Son Kaydı Sil</button><button class="save" id="saveR">Kaydet</button></div></div>`;function collect(){content.querySelectorAll('[data-i]').forEach(e=>{const i=+e.dataset.i;data.records[i]??={};data.records[i][e.dataset.k]=e.value})}addR.onclick=()=>{collect();data.records.push({title:'',status:'',note:''});save(m,data);render(m)};delR.onclick=()=>{collect();data.records.pop();save(m,data);render(m)};saveR.onclick=()=>{collect();save(m,data)}}
function renderPhotos(data){content.innerHTML=`<div class="card"><h3>📷 Tesis Fotoğrafları</h3><div class="photoBox"><img id="preview"><p id="photoText">Tesis genel görünümü veya bölüm fotoğrafı seçin.</p><input id="photoInput" type="file" accept="image/*"></div><div class="grid" style="margin-top:10px"><div class="field"><label>Başlık</label><input id="photoTitle" value="${data.title||''}"></div><div class="field"><label>Çekim tarihi</label><input id="photoDate" type="date" value="${data.date||''}"></div><div class="field"><label>Açıklama</label><textarea id="photoNote">${data.note||''}</textarea></div></div><div class="toolbar"><button class="save" id="savePhoto">Fotoğrafı Kaydet</button><button class="remove" id="removePhoto">Fotoğrafı Kaldır</button></div><div class="notice">Fotoğraf bu prototipte yalnızca bu tarayıcıda saklanır. Büyük ve kurumsal fotoğraf albümü SharePoint doküman kitaplığına taşınmalıdır.</div></div>`;if(data.image){preview.src=data.image;preview.style.display='block';photoText.style.display='none'}photoInput.onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('Prototip için 1,5 MB altında fotoğraf seçin.');return}const r=new FileReader();r.onload=()=>{data.image=r.result;preview.src=data.image;preview.style.display='block';photoText.style.display='none'};r.readAsDataURL(f)};savePhoto.onclick=()=>{data.title=photoTitle.value;data.date=photoDate.value;data.note=photoNote.value;save('photos',data)};removePhoto.onclick=()=>{data.image='';save('photos',data);renderPhotos(data)}}
</script></body></html>
