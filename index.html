<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium 3D Dünya Havacılık Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0;background:radial-gradient(circle at 50% 45%,#10253d 0,#020711 62%,#000 100%);font-family:Arial,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}.hero{position:absolute;z-index:10;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border:1px solid #ffffff22;border-radius:16px;background:#041525c9;backdrop-filter:blur(12px);box-shadow:0 10px 35px #0008;text-align:center;color:#d8e8f3}.hero b{font-size:18px;color:#48efaa;letter-spacing:.4px}.hero small{color:#9db5c6}.buttons{position:absolute;z-index:10;right:20px;top:20px;display:flex;gap:10px}.buttons button{border:1px solid #ffffff22;border-radius:12px;padding:12px 17px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 25px #0006}.world{background:#07324dcc}.turkey{background:#e30a17ee}.hint{position:absolute;z-index:10;bottom:22px;left:22px;color:#c9d9e5;background:#031522bd;border:1px solid #ffffff1c;border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px);font-size:12px}.airport{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#26e797;border:2px solid white;box-shadow:0 0 15px #26e797,0 3px 7px #0009;font-size:13px;cursor:pointer}.maplibregl-popup-content{border-radius:12px;background:#061b29;color:#eaf5fb;box-shadow:0 8px 28px #0008}.maplibregl-popup-tip{border-top-color:#061b29!important}.maplibregl-ctrl-group{background:#071d2b!important}.maplibregl-ctrl button span{filter:invert(1)}
</style></head><body>
<div class="hero">🌐 <b>GLOBAL AVIATION FUEL MAP</b><br><small>Türkiye • Jet A-1 • SAF</small></div>
<div class="buttons"><button class="world" id="world">🌍 Dünya</button><button class="turkey" id="turkey">🇹🇷 Türkiye</button></div>
<div class="hint">🖱️ Küreyi sürükleyerek döndür • Tekerlek ile yakınlaştır</div><div id="map"></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
const satellite='https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg';
const style={version:8,sources:{earth:{type:'raster',tiles:[satellite],tileSize:256,attribution:'EOX Sentinel-2 cloudless'}},layers:[{id:'space',type:'background',paint:{'background-color':'#020711'}},{id:'earth',type:'raster',source:'earth',paint:{'raster-saturation':-.08,'raster-contrast':.12,'raster-brightness-min':.08,'raster-brightness-max':.92}}]};
const map=new maplibregl.Map({container:'map',style,center:[25,25],zoom:1.25,maxZoom:10,canvasContextAttributes:{antialias:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'bottom-right');
map.on('style.load',()=>map.setProjection({type:'globe'}));
const airports=[['İstanbul Havalimanı','IST','LTFM',28.7519,41.2753],['Sabiha Gökçen','SAW','LTFJ',29.3092,40.8986],['Ankara Esenboğa','ESB','LTAC',32.9951,40.1281],['İzmir Adnan Menderes','ADB','LTBJ',27.1570,38.2924],['Antalya Havalimanı','AYT','LTAI',30.8005,36.8987]];
map.on('load',()=>airports.forEach(a=>{const el=document.createElement('div');el.className='airport';el.textContent='✈';new maplibregl.Marker({element:el}).setLngLat([a[3],a[4]]).setPopup(new maplibregl.Popup({offset:18}).setHTML(`<b>${a[0]}</b><br><br>IATA: <b>${a[1]}</b><br>ICAO: <b>${a[2]}</b><br><br>⛽ Jet A-1<br>🌱 SAF`)).addTo(map);}));
document.getElementById('turkey').onclick=()=>map.flyTo({center:[35,39],zoom:5,duration:1800});document.getElementById('world').onclick=()=>map.flyTo({center:[25,25],zoom:1.25,duration:1800});
</script></body></html>
