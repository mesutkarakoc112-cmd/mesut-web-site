<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Globe Aviation Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0;background:radial-gradient(circle,#17202a 0,#050a10 65%,#000 100%);font-family:Arial,sans-serif}.head{position:absolute;z-index:10;top:18px;left:50%;transform:translateX(-50%);background:#17120bd9;border:1px solid #e7c35b55;color:#fff;padding:11px 22px;border-radius:14px;text-align:center;box-shadow:0 8px 28px #0008}.head b{color:#f5d979}.buttons{position:absolute;z-index:10;right:18px;top:18px;display:flex;gap:8px}.buttons button{border:1px solid #f6dc7855;border-radius:10px;padding:11px 15px;font-weight:700;color:#fff;cursor:pointer}.world{background:#34280dcc}.turkey{background:#b30c15e8}.airport{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#ffd65a;border:2px solid #fff5c2;box-shadow:0 0 16px #ffd65a;font-size:13px;color:#251900}.maplibregl-popup-content{background:#17120b;color:#fff5ce;border:1px solid #d8b65c;border-radius:10px}.maplibregl-popup-tip{border-top-color:#17120b!important}
</style></head><body>
<div class="head">🌐 <b>GLOBAL AVIATION FUEL MAP</b><br><small>Türkçe • English</small></div>
<div class="buttons"><button id="world" class="world">🌍 Dünya / World</button><button id="turkey" class="turkey">🇹🇷 Türkiye / Turkey</button></div>
<div id="map"></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[20,28],zoom:1.15,canvasContextAttributes:{antialias:true}});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');
function bilingualLabels(){
 const style=map.getStyle(); if(!style||!style.layers)return;
 for(const layer of style.layers){
  if(layer.type!=='symbol'||!layer.layout||!layer.layout['text-field'])continue;
  const id=(layer.id||'').toLowerCase();
  const isCountry=id.includes('country'); const isCity=id.includes('city')||id.includes('place');
  if(!isCountry&&!isCity)continue;
  try{map.setLayoutProperty(layer.id,'text-field',['format',['coalesce',['get','name:tr'],['get','name']],{'font-scale':isCountry?1.05:.9},' / ',{},['coalesce',['get','name:en'],['get','name']],{'font-scale':isCountry?1.05:.9}]);
      map.setPaintProperty(layer.id,'text-color',isCountry?'#ffe79a':'#fff3c9');
      map.setPaintProperty(layer.id,'text-halo-color','#3a2600');map.setPaintProperty(layer.id,'text-halo-width',1.4);
  }catch(e){}
 }
}
map.on('style.load',()=>{map.setProjection({type:'globe'});bilingualLabels();});
const airports=[['İstanbul Havalimanı','IST','LTFM',28.7519,41.2753],['Sabiha Gökçen','SAW','LTFJ',29.3092,40.8986],['Ankara Esenboğa','ESB','LTAC',32.9951,40.1281],['İzmir Adnan Menderes','ADB','LTBJ',27.157,38.2924],['Antalya Havalimanı','AYT','LTAI',30.8005,36.8987]];
map.on('load',()=>airports.forEach(a=>{const el=document.createElement('div');el.className='airport';el.textContent='✈';new maplibregl.Marker({element:el}).setLngLat([a[3],a[4]]).setPopup(new maplibregl.Popup({offset:18}).setHTML(`<b>${a[0]}</b><br>IATA: ${a[1]}<br>ICAO: ${a[2]}<br>⛽ Jet A-1<br>🌱 SAF`)).addTo(map);}));
document.getElementById('turkey').onclick=()=>map.flyTo({center:[35,39],zoom:4.8,duration:1800});
document.getElementById('world').onclick=()=>map.flyTo({center:[20,28],zoom:1.15,duration:1800});
</script></body></html>
