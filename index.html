<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOCAR Türkiye Aviation Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0;background:radial-gradient(circle,#3b2b08 0,#100c03 58%,#020201 100%);font-family:Arial,sans-serif}.top{position:absolute;z-index:10;top:16px;left:50%;transform:translateX(-50%);background:#211906e8;color:#fff;padding:11px 20px;border:1px solid #ffffff22;border-radius:14px;text-align:center}.top b{color:#f3d56b}.buttons{position:absolute;z-index:12;top:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.buttons button{border:0;border-radius:10px;padding:11px 14px;color:#fff;font-weight:700;cursor:pointer}.world{background:#18445f}.turkey{background:#d71920}.socar{background:#007a3d}.airport{width:21px;height:21px;border:2px solid #fff;border-radius:50%;background:#ffd258;display:grid;place-items:center;font-size:11px;box-shadow:0 0 10px #ffd258;cursor:pointer}.socarAirport{background:#10d37a;box-shadow:0 0 13px #10d37a}.panel{position:absolute;z-index:20;right:18px;top:78px;width:min(390px,calc(100% - 36px));max-height:calc(100% - 100px);overflow:auto;background:#0c1722f2;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:18px;box-shadow:0 14px 40px #0008;display:none}.panel h2{margin:0 0 4px;color:#5aebb0}.panel .muted{color:#9fb2c2;font-size:12px;margin-bottom:14px}.field{margin:9px 0}.field label{display:block;color:#9fb2c2;font-size:12px;margin-bottom:4px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #284253;border-radius:8px;background:#08121b;color:#fff;padding:9px}.field textarea{min-height:62px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.save{background:#14c87b;color:#062416}.add{background:#1c6c92;color:white}.remove{background:#8c2730;color:white}.close{background:#394955;color:white}.notice{font-size:11px;color:#9fb2c2;margin-top:12px;line-height:1.4}.maplibregl-canvas{filter:sepia(.72) saturate(1.55) hue-rotate(355deg) brightness(.9) contrast(1.08)}.maplibregl-popup-content{border-radius:10px;background:#241a07;color:#fff2b0;border:1px solid #d3ad47}
</style></head><body>
<div class="top">🌐 <b>GLOBAL AVIATION FUEL MAP</b><br><small>Türkiye / Turkey</small></div>
<div class="buttons"><button class="world" id="world">🌍 Dünya</button><button class="turkey" id="turkey">🇹🇷 Türkiye</button><button class="socar" id="socar">SOCAR TÜRKİYE AVIATION</button></div>
<div id="map"></div>
<div class="panel" id="panel"><h2 id="pTitle"></h2><div class="muted" id="pCodes"></div><div id="fields"></div><div class="actions"><button class="add" id="addField">+ Alan Ekle</button><button class="remove" id="removeField">− Son Alanı Sil</button><button class="save" id="save">Kaydet</button><button class="close" id="close">Kapat</button></div><div class="notice">Bu düzenlemeler bu tarayıcıda yerel olarak saklanır. Public sitede gizli fiyat, marj, sözleşme veya güvenlik açısından hassas operasyon verisi tutmayın.</div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[20,28],zoom:1.15,canvasContextAttributes:{antialias:true}});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('style.load',()=>map.setProjection({type:'globe'}));
const airports=[
['IST','İstanbul Havalimanı','LTFM',28.7519,41.2753],['SAW','Sabiha Gökçen','LTFJ',29.3092,40.8986],['ESB','Ankara Esenboğa','LTAC',32.9951,40.1281],['ADB','İzmir Adnan Menderes','LTBJ',27.1570,38.2924],['AYT','Antalya Havalimanı','LTAI',30.8005,36.8987],['DLM','Dalaman Havalimanı','LTBS',28.7925,36.7131],['BJV','Milas-Bodrum Havalimanı','LTFE',27.6643,37.2506],['COV','Çukurova Uluslararası Havalimanı','LTDB',35.0705,36.8909],['TZX','Trabzon Havalimanı','LTCG',39.7897,40.9951],['GZT','Gaziantep Havalimanı','LTAJ',37.4787,36.9472],['ASR','Kayseri Havalimanı','LTAU',35.4954,38.7704],['DIY','Diyarbakır Havalimanı','LTCC',40.2010,37.8939],['VAN','Van Ferit Melen Havalimanı','LTCI',43.3323,38.4682],['ERZ','Erzurum Havalimanı','LTCE',41.1702,39.9565],['SZF','Samsun Çarşamba Havalimanı','LTFH',36.5671,41.2545],['OGU','Ordu-Giresun Havalimanı','LTCB',38.0809,40.9660],['RZV','Rize-Artvin Havalimanı','LTFO',40.8294,41.1794],['GZP','Gazipaşa-Alanya Havalimanı','LTFG',32.3006,36.2992],['EDO','Balıkesir Koca Seyit Havalimanı','LTFD',27.0138,39.5546],['KYA','Konya Havalimanı','LTAN',32.5619,37.9790],['MLX','Malatya Havalimanı','LTAT',38.2539,38.4353],['EZS','Elazığ Havalimanı','LTCA',39.2914,38.6069],['HTY','Hatay Havalimanı','LTDA',36.2822,36.3628],['DNZ','Denizli Çardak Havalimanı','LTAY',29.7013,37.7856],['KZR','Zafer Havalimanı','LTBZ',30.1281,39.1114],['NAV','Nevşehir Kapadokya Havalimanı','LTAZ',34.5345,38.7719],['MQM','Mardin Prof. Dr. Aziz Sancar Havalimanı','LTCR',40.6317,37.2233],['BAL','Batman Havalimanı','LTCJ',41.1166,37.9290],['MSR','Muş Sultan Alparslan Havalimanı','LTCK',41.6612,38.7478],['AJI','Ağrı Ahmed-i Hani Havalimanı','LTCO',43.025,39.6545],['KSY','Kars Harakani Havalimanı','LTCF',43.115,40.5622],['IGD','Iğdır Şehit Bülent Aydın Havalimanı','LTCT',43.8766,39.9766],['NKT','Şırnak Cizre Havalimanı','LTCV',42.0582,37.3647],['SXZ','Siirt Havalimanı','LTCL',41.8404,37.9789],['BGG','Bingöl Havalimanı','LTCU',40.5959,38.8593],['YKO','Hakkari Yüksekova Selahaddin Eyyubi Havalimanı','LTCW',44.2381,37.5497]
];
const socarCodes=new Set(['AYT','ADB','BJV','DLM','GZP','ESB','SAW']); let markers=[];
const defaultFields=[['Satış durumu',''],['Satılan ürün',''],['Müşteri / Havayolları',''],['Tedarik kaynağı',''],['Teslimat modeli',''],['Into-plane hizmet şirketi',''],['Depolama şekli',''],['Yaklaşık satış hacmi',''],['Satış başlangıç tarihi',''],['Sözleşme durumu',''],['SAF durumu',''],['Operasyon notu','']];
const defaults={}; socarCodes.forEach(c=>defaults[c]={fields:defaultFields.map(f=>[...f])});
function getData(code){return JSON.parse(localStorage.getItem('socar-'+code)||JSON.stringify(defaults[code]||{fields:[]}));}
function openPanel(a){document.getElementById('panel').style.display='block';document.getElementById('pTitle').textContent=a[1];document.getElementById('pCodes').textContent=`IATA: ${a[0]} • ICAO: ${a[2]}`;document.getElementById('panel').dataset.code=a[0];renderFields(getData(a[0]).fields);}
function renderFields(fs){const c=document.getElementById('fields');c.innerHTML='';fs.forEach((f,i)=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label contenteditable="true">${f[0]}</label>${i===fs.length-1?`<textarea>${f[1]}</textarea>`:`<input value="${String(f[1]).replaceAll('"','&quot;')}">`}`;c.appendChild(d);});}
function collect(){return [...document.querySelectorAll('#fields .field')].map(d=>[d.querySelector('label').innerText.trim(),(d.querySelector('input,textarea')?.value||'')]);}
function addMarkers(socarOnly=false){markers.forEach(m=>m.remove());markers=[];airports.filter(a=>!socarOnly||socarCodes.has(a[0])).forEach(a=>{const el=document.createElement('div');el.className='airport'+(socarCodes.has(a[0])?' socarAirport':'');el.textContent='✈';el.onclick=()=>openPanel(a);markers.push(new maplibregl.Marker({element:el}).setLngLat([a[3],a[4]]).setPopup(new maplibregl.Popup({offset:16}).setHTML(`<b>${a[1]}</b><br>IATA: ${a[0]} • ICAO: ${a[2]}`)).addTo(map));});}
map.on('load',()=>addMarkers(false));
document.getElementById('world').onclick=()=>{addMarkers(false);map.flyTo({center:[20,28],zoom:1.15,duration:1600});};
document.getElementById('turkey').onclick=()=>{addMarkers(false);map.flyTo({center:[35,39],zoom:4.6,duration:1600});};
document.getElementById('socar').onclick=()=>{addMarkers(true);map.flyTo({center:[35,39],zoom:4.6,duration:1600});};
document.getElementById('addField').onclick=()=>{const fs=collect();fs.push(['Yeni alan','']);renderFields(fs);};
document.getElementById('removeField').onclick=()=>{const fs=collect();fs.pop();renderFields(fs);};
document.getElementById('save').onclick=()=>{const code=document.getElementById('panel').dataset.code;localStorage.setItem('socar-'+code,JSON.stringify({fields:collect()}));alert('Kaydedildi.');};
document.getElementById('close').onclick=()=>document.getElementById('panel').style.display='none';
</script></body></html>
